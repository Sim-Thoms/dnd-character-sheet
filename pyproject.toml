[project]
name = "dnd-character-sheet"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "colorama==0.4.6",
    "fastapi>=0.149.0",
    "iniconfig==2.3.0",
    "jinja2>=3.1.6",
    "packaging==26.2",
    "pluggy==1.6.0",
    "pydantic>=2.13.5",
    "pygments==2.20.0",
    "pymongo[srv]>=4.10",
    "pytest==9.1.1",
    "python-dotenv>=1.2.3",
    "pyyaml==6.0.3",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dnd_character_sheet"]